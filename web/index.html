<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1e21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#d8dbe1" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Satz</title>
    <style>
      @font-face {
        font-family: 'Source Serif 4';
        src: url('../engine/fonts/SourceSerif4-Regular.ttf') format('truetype');
        font-display: optional;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1e1e21;
        color: #d8dbe1;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #d8dbe1;
          color: #1e1e21;
        }
      }
      .loading {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        height: 100%;
      }
      .loading h1 {
        margin: 0;
        font: 400 56px/1 'Source Serif 4', Georgia, 'Times New Roman', serif;
      }
      .loading .progress {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .loading .progress::after {
        content: '';
        display: block;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        transform: translateX(-100%);
        animation: fill 30s cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
      }
      @keyframes fill {
        to {
          transform: translateX(-4%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading .progress::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="loading">
        <h1>Satz</h1>
        <div class="progress" role="progressbar" aria-label="Loading Satz"></div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
