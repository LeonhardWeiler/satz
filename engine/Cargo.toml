[package]
name = "engine"
version = "0.1.0"
edition = "2024"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harfrust = "0.13.3"
hypher = { version = "0.1.8", default-features = false, features = ["english", "german"] }
js-sys = "=0.3.104"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
loro = "1.16.2"
moxcms = { version = "0.9.1", default-features = false, features = ["lut"] }
png = "0.18.1"
read-fonts = "0.43.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.151"
skrifa = "0.42.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
wasm-bindgen = "=0.2.127"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
